[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "titanic_survival_predictor"
version = "0.0.1"
description = "predict whether someone survives the titanic incident based on some criteria"
authors = [
  { name = "yudha" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["titanic_survival_predictor"]
include = ["pyproject.toml", "titanic_survival_predictor/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["titanic_survival_predictor"]
force-sort-within-sections = true

